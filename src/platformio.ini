; ------------------------------------------
; MACRO PAD - ESP32-S3 + ILI9341
; ------------------------------------------
[platformio]
default_envs = ili9341

[env:ili9341]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = dio_opi
board_build.arduino_psram = enabled
board_build.flash_mode = qio
board_build.filesystem = fatfs
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
  default
  esp32_exception_decoder

lib_deps =
  bodmer/TFT_eSPI
  https://github.com/adafruit/Adafruit_Keypad
  mathertel/RotaryEncoder
  bblanchon/ArduinoJson@^7.0.0
  bitbank2/AnimatedGIF@^2.1.0
  h2zero/NimBLE-Arduino@^1.4.2
  https://github.com/T-vK/ESP32-BLE-Keyboard.git

build_flags =
  ; DISPLAY
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  ; ESP32-S3: without this TFT_eSPI selects SPI_PORT=FSPI=0, and the S3
  ; REG_SPI_BASE(0) macro resolves to 0 - the driver then writes to
  ; address 0x10 and panics on the first command. HSPI maps to SPI3.
  -D USE_HSPI_PORT
  -D TFT_MISO=13
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=46
  -D TFT_RST=3
  -D TFT_BL=14
  -D TFT_BACKLIGHT_ON=HIGH
  -D TOUCH_CS=9
  -D LOAD_GLCD=1
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  ; font 7 is the seven segment face used by the clock screen
  -D LOAD_FONT7
  -D SPI_FREQUENCY=27000000

  ; ESP32 S3
  -D BOARD_HAS_PSRAM

  ; BLE keyboard on NimBLE - roughly half the flash of Bluedroid
  -D USE_NIMBLE

  ; serial debug output, comment out for a quiet build
  -D _DEBUG


; ------------------------------------------
; MICRO JOURNAL REVISION 6
; With Keypad and ST7789 display
; ------------------------------------------
[env:st7789]
extends = env:ili9341
build_unflags =
  ; extends does not merge build_unflags, it replaces them - without this
  ; the board's ARDUINO_USB_MODE=1 survives and collides with the =0 below
  ${env:ili9341.build_unflags}
  -D ILI9341_DRIVER=1

build_flags =  
  ${env:ili9341.build_flags}
  -D ST7789_DRIVER=1
  -D TFT_INVERSION_OFF
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
